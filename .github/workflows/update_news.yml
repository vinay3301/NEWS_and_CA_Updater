name: News and Current Affairs PDF Updater

on:
  workflow_dispatch:
  schedule:
    # Every 3 hours. 00:00 UTC = 05:30 India time.
    - cron: "0 */3 * * *"

permissions:
  contents: read

concurrency:
  group: news-ca-updater
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Kolkata
      NEWS_CA_OUTPUT_DIR: ${{ github.workspace }}/news-ca-output
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GOOGLE_APPS_SCRIPT_URL: ${{ secrets.GOOGLE_APPS_SCRIPT_URL }}
      GOOGLE_APPS_SCRIPT_SECRET: ${{ secrets.GOOGLE_APPS_SCRIPT_SECRET }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
      MOBILE_DRIVE_FOLDER_NAME: Mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate upload configuration
        shell: bash
        run: |
          if [ -n "$GOOGLE_APPS_SCRIPT_URL" ] && [ -n "$GOOGLE_APPS_SCRIPT_SECRET" ]; then
            echo "Google Apps Script upload bridge is configured."
          elif [ -n "$GOOGLE_OAUTH_CLIENT_ID" ] && [ -n "$GOOGLE_OAUTH_CLIENT_SECRET" ] && [ -n "$GOOGLE_OAUTH_REFRESH_TOKEN" ]; then
            echo "Apps Script bridge is not configured; using the existing OAuth fallback."
          else
            echo "::error::Configure both GOOGLE_APPS_SCRIPT_URL and GOOGLE_APPS_SCRIPT_SECRET, or all three existing Google OAuth secrets."
            exit 1
          fi

      - name: Check Python syntax
        run: python -m py_compile News_CA_Updater.py

      - name: Generate PDFs and upload both versions to Google Drive (Apps Script bridge or OAuth fallback)
        run: python News_CA_Updater.py

      - name: Verify generated PDFs
        shell: bash
        run: |
          test -s "$NEWS_CA_OUTPUT_DIR/Daily_Articles.pdf"
          test -s "$NEWS_CA_OUTPUT_DIR/Daily_Articles_Desktop.pdf"
          ls -lh "$NEWS_CA_OUTPUT_DIR"

      - name: Save generated PDFs as downloadable workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: News-and-Current-Affairs-PDFs
          path: |
            ${{ github.workspace }}/news-ca-output/Daily_Articles.pdf
            ${{ github.workspace }}/news-ca-output/Daily_Articles_Desktop.pdf
          if-no-files-found: error
          retention-days: 7
