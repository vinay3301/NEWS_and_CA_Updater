name: Scheduled and Manual Production News CA PDF Update

on:
  # GitHub cron uses UTC. Every 4 hours, around the clock.
  schedule:
    - cron: "30 */4 * * *"

  workflow_dispatch:
    inputs:
      confirm_drive_upload:
        description: "Choose yes to run the full scraper and overwrite the existing Drive PDFs."
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read

concurrency:
  group: news-ca-production-update
  cancel-in-progress: false

jobs:
  production-update:
    # Scheduled runs are authorized for automatic uploads. Manual runs still
    # require the explicit yes confirmation.
    if: ${{ github.event_name == 'schedule' || inputs.confirm_drive_upload == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run production scraper and upload PDFs
        env:
          GITHUB_ACTIONS: "true"
          PYTHONUNBUFFERED: "1"
          ADDA247_PROXY_URL: ${{ secrets.ADDA247_PROXY_URL }}
          ADDA247_PROXY_SECRET: ${{ secrets.ADDA247_PROXY_SECRET }}
          GOOGLE_APPS_SCRIPT_URL: ${{ secrets.GOOGLE_APPS_SCRIPT_URL }}
          GOOGLE_APPS_SCRIPT_SECRET: ${{ secrets.GOOGLE_APPS_SCRIPT_SECRET }}
        run: python -u News_CA_Updater.py
