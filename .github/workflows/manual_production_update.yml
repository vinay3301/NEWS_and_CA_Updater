name: Scheduled and Manual Production News CA PDF Update

on:
  workflow_dispatch:
    inputs:
      confirm_drive_upload:
        description: "Choose yes to run the full scraper and overwrite the existing Drive PDFs."
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read

concurrency:
  group: news-ca-production-update
  cancel-in-progress: false

jobs:
  production-update:
    # Scheduled runs are authorized for automatic uploads. Manual runs still
    # require the explicit yes confirmation.
    if: ${{ github.event_name == 'schedule' || inputs.confirm_drive_upload == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Record workflow start time
        id: workflow_start
        run: echo "started_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run production scraper and upload PDFs
        id: run_production
        env:
          GITHUB_ACTIONS: "true"
          PYTHONUNBUFFERED: "1"
          ADDA247_PROXY_URL: ${{ secrets.ADDA247_PROXY_URL }}
          ADDA247_PROXY_SECRET: ${{ secrets.ADDA247_PROXY_SECRET }}
          GOOGLE_APPS_SCRIPT_URL: ${{ secrets.GOOGLE_APPS_SCRIPT_URL }}
          GOOGLE_APPS_SCRIPT_SECRET: ${{ secrets.GOOGLE_APPS_SCRIPT_SECRET }}
        run: python -u News_CA_Updater.py
      - name: Send completion email notification
        if: always()
        continue-on-error: true
        env:
          NOTIFICATION_WEBHOOK_URL: ${{ secrets.NOTIFICATION_WEBHOOK_URL }}
          NOTIFICATION_WEBHOOK_SECRET: ${{ secrets.NOTIFICATION_WEBHOOK_SECRET }}
          JOB_STATUS: ${{ job.status }}
          PRODUCTION_OUTCOME: ${{ steps.run_production.outcome }}
          STARTED_AT: ${{ steps.workflow_start.outputs.started_at }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          webhook_url = os.environ.get("NOTIFICATION_WEBHOOK_URL")
          webhook_secret = os.environ.get("NOTIFICATION_WEBHOOK_SECRET")
          if not webhook_url or not webhook_secret:
              raise RuntimeError("Notification webhook URL or secret is missing.")

          job_status = os.environ.get("JOB_STATUS", "").lower()
          production_outcome = os.environ.get("PRODUCTION_OUTCOME", "").lower()
          conclusion = (
              "success"
              if job_status == "success" and production_outcome == "success"
              else "failure"
          )

          now = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
          started_at = os.environ.get("STARTED_AT") or now
          run_id = int(os.environ["RUN_ID"])
          run_number = int(os.environ["RUN_NUMBER"])
          run_attempt = int(os.environ["RUN_ATTEMPT"])
          repository = os.environ["REPOSITORY"]
          server_url = os.environ["SERVER_URL"].rstrip("/")

          payload = {
              "secret": webhook_secret,
              "workflow_run": {
                  "id": run_id,
                  "run_number": run_number,
                  "run_attempt": run_attempt,
                  "name": os.environ["WORKFLOW_NAME"],
                  "event": os.environ["EVENT_NAME"],
                  "conclusion": conclusion,
                  "status": "completed",
                  "run_started_at": started_at,
                  "created_at": started_at,
                  "updated_at": now,
                  "html_url": f"{server_url}/{repository}/actions/runs/{run_id}"
              }
          }

          request = Request(
              webhook_url,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          try:
              # Apps Script may take longer to send the email and finish its response.
          with urlopen(request, timeout=120) as response:
                  response_text = response.read().decode("utf-8")
          except HTTPError as error:
              response_text = error.read().decode("utf-8", errors="replace")
              raise RuntimeError(
                  f"Notification webhook returned HTTP {error.code}: {response_text}"
              )

          result = json.loads(response_text)
          if not result.get("ok"):
              raise RuntimeError(
                  "Notification webhook rejected request: "
                  + str(result.get("error", "unknown error"))
              )

          print(
              f"Email notification accepted for workflow run {run_id} "
              f"(conclusion: {conclusion})."
          )
          PY
