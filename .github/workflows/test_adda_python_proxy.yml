name: Test Production Adda247 Scraper Through Apps Script Proxy

on:
  workflow_dispatch:
  push:
    paths:
      - "News_CA_Updater.py"
      - ".github/workflows/test_adda_python_proxy.yml"

jobs:
  test-python-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install production dependencies
        run: python -m pip install --quiet -r requirements.txt

      - name: Compile scraper and test Adda247 recovery and PDF fallback safeguards
        env:
          GITHUB_ACTIONS: "true"
          GOOGLE_APPS_SCRIPT_URL: "https://test.invalid/"
          GOOGLE_APPS_SCRIPT_SECRET: "test-only-not-used"
        run: |
          python -m py_compile News_CA_Updater.py
          python - <<'PY'
          import News_CA_Updater as scraper

          headline = "Prathap Singh appointed to an important banking leadership role"
          fallback = (
              headline,
              [{"type": "paragraph", "text": headline}],
              None,
          )

          scraper.extract_affairscloud_rich_content = lambda *args: fallback
          result = scraper.extract_adda247_article_content(
              object(), "https://currentaffairs.adda247.com/test-article/", headline
          )
          assert result[3] is False, "Headline-only fallback was incorrectly marked complete."

          body = headline + "\\n\\nThe institution announced the appointment and provided further details."
          scraper.extract_affairscloud_rich_content = lambda *args: (
              body,
              [{"type": "paragraph", "text": body}],
              None,
          )
          result = scraper.extract_adda247_article_content(
              object(), "https://currentaffairs.adda247.com/test-article/", headline
          )
          assert result[3] is True, "Substantive article body was incorrectly marked incomplete."

          scraper.time.sleep = lambda _seconds: None
          row = {
              "title": headline,
              "raw_link": "https://currentaffairs.adda247.com/test-article/",
              "desc": headline,
              "plain_text": headline,
              "structured_content": fallback[1],
              "image_url": None,
              "content_extracted": False,
          }
          incomplete = scraper.retry_incomplete_adda247_articles([row], object())
          assert not incomplete and row["content_extracted"] is True
          assert "further details" in row["desc"]
          print("PASS: fallback detection, second-pass recovery, and row update.")

          scraper.extract_affairscloud_rich_content = lambda *args: fallback
          row["content_extracted"] = False
          incomplete = scraper.retry_incomplete_adda247_articles([row], object())
          assert len(incomplete) == 1
          assert incomplete[0]["content_extracted"] is False
          print("PASS: persistently incomplete article is retained for headline + source-link PDF fallback.")
          PY

      - name: Test PDF upload timeout and retry handling without contacting Drive
        run: |
          python - <<'PY'
          import tempfile
          from unittest.mock import patch

          import requests
          import News_CA_Updater as scraper

          scraper.UPLOAD_BRIDGE_URL = "https://test.invalid/"
          scraper.UPLOAD_BRIDGE_SECRET = "test-only-not-used"
          scraper.time.sleep = lambda _seconds: None

          attempts = []

          class FakeResponse:
              def raise_for_status(self):
                  return None

              def json(self):
                  return {
                      "ok": True,
                      "action": "updated",
                      "fileId": "test-file-id",
                      "size": 1234,
                  }

          def fake_post(url, json, headers, timeout):
              attempts.append(timeout)
              assert timeout == (180, 600), "Upload timeout settings were not increased."
              if len(attempts) == 1:
                  raise requests.exceptions.ConnectionError("simulated write timeout")
              return FakeResponse()

          with tempfile.NamedTemporaryFile(suffix=".pdf") as pdf:
              pdf.write(b"%PDF-1.4 test payload")
              pdf.flush()
              with patch.object(scraper.requests, "post", side_effect=fake_post):
                  assert scraper.upload_pdf_via_apps_script(
                      pdf.name, "Daily_Articles.pdf"
                  ) is True

          assert len(attempts) == 2, "Upload did not retry after the simulated timeout."
          print("PASS: upload retries transient write failures and succeeds without a real Drive request.")
          PY

      - name: Run production Adda247 scraper functions in isolated test mode
        env:
          ADDA247_PROXY_URL: ${{ secrets.ADDA247_PROXY_URL }}
          ADDA247_PROXY_SECRET: ${{ secrets.ADDA247_PROXY_SECRET }}
        run: |
          python - <<'PY'
          import os
          import time
          from types import SimpleNamespace
          from urllib.parse import urlparse

          import requests

          # The production module validates upload credentials during import.
          # Supply inert test-only placeholders; this test never calls run_updates()
          # or any Drive upload function.
          os.environ["GITHUB_ACTIONS"] = "true"
          os.environ["GOOGLE_APPS_SCRIPT_URL"] = "https://test.invalid/"
          os.environ["GOOGLE_APPS_SCRIPT_SECRET"] = "test-only-not-used"

          import News_CA_Updater as scraper

          proxy_url = os.environ.get("ADDA247_PROXY_URL", "").strip()
          proxy_secret = os.environ.get("ADDA247_PROXY_SECRET", "")

          # First verify the production proxy adapter itself, not a test copy.
          production_session = scraper.Adda247ProxySession(requests.Session())
          listing_response = production_session.get(
              "https://currentaffairs.adda247.com/"
          )
          if listing_response.status_code != 200 or len(listing_response.text) < 10000:
              raise SystemExit("FAIL: production Adda247 proxy adapter could not fetch the homepage.")
          print(
              "PRODUCTION ADAPTER SMOKE TEST: homepage HTTP",
              listing_response.status_code,
              "HTML chars",
              len(listing_response.text),
          )

          if not proxy_url or not proxy_secret:
              raise SystemExit("Missing Adda247 proxy GitHub secrets.")

          transport = requests.Session()
          transport.headers.update({"Content-Type": "application/json"})

          class AppsScriptProxySession:
              """Drop-in GET session for the production scraper; fetches Adda247 via Apps Script."""

              def __init__(self):
                  self.article_requests = 0
                  self.listing_requests = 0
                  self.article_successes = 0
                  self.failed_requests = 0

              def get(self, url, headers=None, timeout=None):
                  parsed = urlparse(url)
                  if parsed.hostname not in (
                      "currentaffairs.adda247.com",
                      "www.currentaffairs.adda247.com",
                  ):
                      raise RuntimeError("Test session blocked non-Adda247 URL: " + url)

                  is_article = (
                      parsed.path.rstrip("/") not in (
                          "",
                          "/latest-posts",
                          "/banking-current-affairs",
                      )
                  )

                  if "lcp_page0=" in parsed.query:
                      print("TEST LIMIT: stopping after banking listing page 1.")
                      return SimpleNamespace(status_code=204, text="", url=url)

                  if is_article:
                      self.article_requests += 1
                  else:
                      self.listing_requests += 1

                  last_status = 0
                  last_html = ""

                  for attempt in (1, 2, 3):
                      try:
                          response = transport.post(
                              proxy_url,
                              json={"secret": proxy_secret, "url": url},
                              timeout=(30, 180),
                          )
                          response.raise_for_status()
                          result = response.json()
                          last_status = int(result.get("status") or 0)
                          last_html = result.get("html") or ""

                          print(
                              "PROXY",
                              "article" if is_article else "listing",
                              parsed.path,
                              "attempt", attempt,
                              "origin status", last_status,
                              "HTML bytes", len(last_html),
                          )

                          if result.get("ok") and last_status == 200 and len(last_html) > 10000:
                              if is_article:
                                  self.article_successes += 1
                              return SimpleNamespace(
                                  status_code=200,
                                  text=last_html,
                                  url=url,
                              )

                      except Exception as exc:
                          print("Proxy attempt", attempt, "failed:", type(exc).__name__, str(exc)[:240])

                      if attempt < 3:
                          time.sleep(3)

                  self.failed_requests += 1
                  return SimpleNamespace(
                      status_code=last_status or 502,
                      text=last_html,
                      url=url,
                  )

          proxy_session = AppsScriptProxySession()

          # Keep the real article HTML parser, but cap full article downloads
          # to five pages so this diagnostic run does not exhaust UrlFetch quota.
          original_extractor = scraper.extract_affairscloud_rich_content
          parse_counts = {"article_parse_count": 0, "successful_content_parses": 0}

          def capped_real_extractor(session, url, headline):
              if parse_counts["article_parse_count"] >= 5:
                  return (
                      headline,
                      [{"type": "paragraph", "text": headline}],
                      None,
                  )

              parse_counts["article_parse_count"] += 1
              plain_text, structured, image_url = original_extractor(
                  session, url, headline
              )
              if plain_text and len(plain_text.strip()) > len(headline.strip()) + 20:
                  parse_counts["successful_content_parses"] += 1
              print(
                  "PRODUCTION ARTICLE PARSER:",
                  "content chars =", len(plain_text or ""),
                  "structured blocks =", len(structured or []),
                  "image found =", bool(image_url),
              )
              return plain_text, structured, image_url

          scraper.extract_affairscloud_rich_content = capped_real_extractor

          print("\n========== PRODUCTION FUNCTION: RECENT CURRENT AFFAIRS ==========")
          ca_rows = scraper.fetch_adda247_previous_3_days(proxy_session)

          print("\n========== PRODUCTION FUNCTION: BANKING CURRENT AFFAIRS ==========")
          banking_rows = scraper.fetch_banking_current_affairs(
              proxy_session,
              cutoff_days=90,
          )

          print("\n==================== INTEGRATION SUMMARY ====================")
          print("Recent CA rows returned:", len(ca_rows))
          print("Banking rows returned:", len(banking_rows))
          print("Listing requests:", proxy_session.listing_requests)
          print("Article requests attempted:", proxy_session.article_requests)
          print("Article pages fetched successfully:", proxy_session.article_successes)
          print("Real production article parses attempted:", parse_counts["article_parse_count"])
          print("Real production article parses with substantive content:", parse_counts["successful_content_parses"])
          print("Proxy requests that exhausted retries:", proxy_session.failed_requests)

          for label, rows in (("Recent CA", ca_rows), ("Banking", banking_rows)):
              for row in rows[:3]:
                  print(label, "sample:", row.get("title", "")[:140])
                  print("  description chars:", len(row.get("desc") or ""))
                  print("  structured blocks:", len(row.get("structured_content") or []))

          if not ca_rows:
              raise SystemExit("FAIL: production recent-CA scraper returned zero rows.")
          if not banking_rows:
              raise SystemExit("FAIL: production banking scraper returned zero rows.")
          if proxy_session.article_successes == 0:
              raise SystemExit("FAIL: no individual article HTML was fetched through the proxy.")
          if parse_counts["successful_content_parses"] == 0:
              raise SystemExit("FAIL: production article parser did not extract substantive article content.")

          print("PASS: both production Adda247 listing functions and the real article parser worked through Apps Script.")
          PY
