name: Test Adda247 Apps Script Proxy

on:
  workflow_dispatch:

jobs:
  test-proxy:
    runs-on: ubuntu-latest
    steps:
      - name: Install HTML parser dependency
        run: python -m pip install --quiet beautifulsoup4

      - name: Test listing pages and one individual article
        env:
          ADDA247_PROXY_URL: ${{ secrets.ADDA247_PROXY_URL }}
          ADDA247_PROXY_SECRET: ${{ secrets.ADDA247_PROXY_SECRET }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urljoin, urlparse
          import requests
          from bs4 import BeautifulSoup

          proxy_url = os.environ.get("ADDA247_PROXY_URL", "").strip()
          proxy_secret = os.environ.get("ADDA247_PROXY_SECRET", "")

          if not proxy_url or not proxy_secret:
              raise SystemExit("Missing ADDA247_PROXY_URL or ADDA247_PROXY_SECRET GitHub secret.")

          session = requests.Session()
          session.headers.update({"Content-Type": "application/json"})
          failures = []
          page_html = {}

          def fetch_through_proxy(payload, label):
              response = session.post(
                  proxy_url,
                  json={"secret": proxy_secret, **payload},
                  timeout=(30, 180)
              )
              print("Proxy HTTP status:", response.status_code)
              response.raise_for_status()
              result = response.json()
              html = result.get("html", "")
              status = result.get("status")
              print("Apps Script fetch status:", status)
              print("HTML length reported by Apps Script:", result.get("htmlLength"))
              print("HTML received by GitHub:", len(html))
              print("HTML detected:", "<html" in html[:1000].lower() or "<!doctype" in html[:1000].lower())

              if not result.get("ok") or status != 200 or len(html) < 10000:
                  raise RuntimeError(result.get("error", f"{label} fetch failed or HTML unexpectedly short"))
              return html

          for page in ["homepage", "latest", "banking"]:
              print("\\n" + "=" * 55)
              print("Testing page:", page)
              succeeded = False

              for attempt in (1, 2):
                  try:
                      if attempt == 2:
                          print("Retrying", page, "once after the first unsuccessful response...")
                      html = fetch_through_proxy({"page": page}, page)
                      page_html[page] = html
                      print("PASS:", page, "(attempt", attempt, ")")
                      succeeded = True
                      break
                  except Exception as error:
                      print("Attempt", attempt, "ERROR:", str(error))

              if not succeeded:
                  failures.append(page)

          print("\\n" + "=" * 55)
          print("Finding an individual article URL...")
          article_url = None

          # Use the same card selectors as the production Python scraper.
          # This avoids mistaking broad category/archive links for news articles.
          category_slugs = {
              "national-current-affairs",
              "banking-current-affairs",
              "latest-posts",
              "daily-current-affairs",
              "current-affairs",
              "monthly-current-affairs",
              "weekly-current-affairs",
          }

          for source_page in ("latest", "homepage", "banking"):
              source_html = page_html.get(source_page, "")
              if not source_html:
                  continue

              base_url = {
                  "latest": "https://currentaffairs.adda247.com/latest-posts/",
                  "homepage": "https://currentaffairs.adda247.com/",
                  "banking": "https://currentaffairs.adda247.com/banking-current-affairs/",
              }[source_page]

              soup = BeautifulSoup(source_html, "html.parser")
              posts = soup.select(
                  "article, li.category_postlist, "
                  "div.post-content, div.entry-header, div.ca-card"
              )

              for post in posts:
                  anchor = post.find("a", href=True)
                  if not anchor:
                      continue

                  title = " ".join(anchor.get_text(" ", strip=True).split())
                  if len(title) < 15:
                      continue

                  candidate = urljoin(base_url, anchor["href"].strip())
                  parsed = urlparse(candidate)
                  if parsed.scheme != "https" or parsed.hostname not in (
                      "currentaffairs.adda247.com", "www.currentaffairs.adda247.com"
                  ):
                      continue

                  path_parts = [part.lower() for part in parsed.path.strip("/").split("/") if part]
                  if not path_parts:
                      continue
                  slug = path_parts[-1]
                  if slug in category_slugs or slug.startswith(("category-", "tag-")):
                      continue
                  if any(part in ("category", "tag", "author", "page") for part in path_parts):
                      continue
                  if parsed.path.lower().endswith(
                      (".jpg", ".jpeg", ".png", ".webp", ".gif", ".pdf", ".css", ".js", ".xml")
                  ):
                      continue

                  # Require a date marker within the same card when available.
                  # The production scraper accepts missing dates, so this is a
                  # preference rather than a hard requirement.
                  date_marker = (
                      post.find("time")
                      or post.find("p", class_=lambda value: value and "date" in " ".join(value).lower())
                      or post.find("span", class_=lambda value: value and "date" in " ".join(value).lower())
                  )

                  article_url = candidate.split("#", 1)[0]
                  print("Found news-card candidate:", title[:120])
                  print("Candidate has date marker:", bool(date_marker))
                  print("Found candidate using", source_page, "HTML.")
                  break

              if article_url:
                  break

          if not article_url:
              print("ERROR: Could not identify an individual Adda247 article URL from the available listing pages.")
              failures.append("individual-article-url-discovery")
          else:
              print("Selected article URL:", article_url)
              print("Testing individual article fetch...")
              try:
                  article_html = fetch_through_proxy({"url": article_url}, "individual article")
                  print("PASS: individual article")
              except Exception as error:
                  print("ERROR:", str(error))
                  failures.append("individual-article")

          print("\\n" + "=" * 55)
          if failures:
              print("FAILED TESTS:", ", ".join(failures))
              raise SystemExit(1)

          print("SUCCESS: All three listing pages and one individual article were relayed to GitHub.")
          PY
