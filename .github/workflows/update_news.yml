name: News and Current Affairs PDF Updater

on:
  workflow_dispatch:
  schedule:
    # Every 3 hours. 00:00 UTC = 05:30 India time.
    - cron: "0 */3 * * *"

permissions:
  contents: read

concurrency:
  group: news-ca-updater
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Kolkata
      NEWS_CA_OUTPUT_DIR: ${{ github.workspace }}/news-ca-output
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
      MOBILE_DRIVE_FOLDER_NAME: Mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Google OAuth secrets
        shell: bash
        run: |
          for name in GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET GOOGLE_OAUTH_REFRESH_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Add the $name repository secret before running this workflow."
              exit 1
            fi
          done
          echo "All required Google OAuth secrets are present."

      - name: Check Python syntax
        run: python -m py_compile News_CA_Updater.py

      - name: Generate PDFs and upload both versions to Google Drive
        run: python News_CA_Updater.py

      - name: Verify generated PDFs
        shell: bash
        run: |
          test -s "$NEWS_CA_OUTPUT_DIR/Daily_Articles.pdf"
          test -s "$NEWS_CA_OUTPUT_DIR/Daily_Articles_Desktop.pdf"
          ls -lh "$NEWS_CA_OUTPUT_DIR"

      - name: Save generated PDFs as downloadable workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: News-and-Current-Affairs-PDFs
          path: |
            ${{ github.workspace }}/news-ca-output/Daily_Articles.pdf
            ${{ github.workspace }}/news-ca-output/Daily_Articles_Desktop.pdf
          if-no-files-found: error
          retention-days: 7
